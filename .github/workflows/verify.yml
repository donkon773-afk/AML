name: Verify AML/NAM

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-verification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Python client and test dependencies
        run: python -m pip install -r requirements-client.txt
      - name: Install Node test dependencies
        run: npm ci --no-audit --no-fund
      - name: Run offline release gate
        run: python verify.py
